# Configure your build environment: http://www.gradle.org/docs/current/userguide/build_environment.html
org.gradle.caching=true
# NOTE: lowered from -Xmx6g for the 2GB build server; heavy release builds run on GitHub Actions
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
